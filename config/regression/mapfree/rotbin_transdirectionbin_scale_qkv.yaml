MODEL: 'Regression'
ENCODER:
  TYPE: 'ResUNet'
  BLOCK_TYPE: 1
  NUM_BLOCKS: '3-3-3'
  NOT_CONCAT: False
  NUM_OUT_LAYERS: 32
AGGREGATOR:
  TYPE: 'CorrelationVolumeWarpingQKV'
  POSITION_ENCODER: True
  MAX_SCORE_CHANNEL: True
  NORMALISE_DOT: False
  RESIDUAL_ATT: True
HEAD:
  TYPE: 'AngularBinsDeepResBlockMLP'
  SEPARATE_SCALE: True
  AVG_POOL: True
TRAINING:
  LR: 1e-4
  LOG_INTERVAL: 50
  VAL_INTERVAL: 0.25
  VAL_BATCHES: 500
  EPOCHS: 50
  ROT_LOSS: 'rot_bin_loss'
  TRANS_LOSS: 'trans_sphbin_loss'
  LAMBDA: 1.
BACKPROJECT_ANCHORS: False