MODEL: 'Regression'
ENCODER:
  TYPE: 'ResUNet'
  BLOCK_TYPE: 1
  NUM_BLOCKS: '3-3-3'
  NOT_CONCAT: False
  NUM_OUT_LAYERS: 32
AGGREGATOR:
  TYPE: 'CorrelationVolumeWarping'
  POSITION_ENCODER: True
  MAX_SCORE_CHANNEL: True
HEAD:
  TYPE: 'QuatDeepResBlock'
  SEPARATE_SCALE: False # trans. vector is regressed WITH scale, not using independent 1D scale
TRAINING:
  LR: 1e-4
  ROT_LOSS: 'quat_l1_loss'
  TRANS_LOSS: 'trans_l1_loss'
  LAMBDA: 0.
BACKPROJECT_ANCHORS: False