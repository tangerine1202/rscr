MODEL: 'Regression'
ENCODER:
  TYPE: 'ResUNet'
  BLOCK_TYPE: 1
  NUM_BLOCKS: '3-3-3'
  NOT_CONCAT: False
  NUM_OUT_LAYERS: 32
AGGREGATOR:
  TYPE: 'CorrelationVolumeWarping'
  POSITION_ENCODER: True
  MAX_SCORE_CHANNEL: True
HEAD:
  TYPE: 'DirectDeepResBlockMLP'
  ADD_BASIS: True
  AVG_POOL: True
TRAINING:
  LR: 1e-4
  # loss
  ROT_LOSS: 'rot_angle_loss'
  TRANS_LOSS: 'trans_l1_loss'
  LAMBDA: 1.
BACKPROJECT_ANCHORS: False