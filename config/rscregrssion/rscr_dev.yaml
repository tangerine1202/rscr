MODEL: 'Hybrid'
ENCODER:
  TYPE: 'AceBackbone'
  NUM_OUT_LAYERS: 512
  # SHOULD_FREEZE: False
  # SHOULD_LOAD_PRETRAINED: True
  # PRETRAINED_PATH: 'pretrained/ace_encoder_pretrained.pt'
AGGREGATOR:
  TYPE: 'CorrelationVolumeWarpingQKV'
  POSITION_ENCODER: True
  # MAX_SCORE_CHANNEL: False
SC_HEAD:
  TYPE: 'AceHead'
  # SHOULD_FREEZE: False
  # SHOULD_LOAD_PRETRAINED: True
  # PRETRAINED_CKPT: 'weights/(7s)sc_init/version_4/checkpoints/eepoch=99-last.ckpt'
  # PRETRAINED_CKPT_MODULE: 'head'
RPR_HEAD:
  TYPE: 'DirectDeepResBlockMLP'
  SHOULD_FREEZE: True
  # SHOULD_LOAD_PRETRAINED: True
  # PRETRAINED_CKPT: 'weights/default/version_5/checkpoints/eepoch=183-last.ckpt'
  # PRETRAINED_CKPT_MODULE: 'rpr_head'
POSE_SOLVER: 'PNP'
PNP:
  USE_RANSAC: False
  ALGO: 'SQPNP'
  # RANSAC_ITER: 1000
  # REPROJECTION_INLIER_THRESHOLD: 3
  # CONFIDENCE: 0.9999
TRAINING:
  # BATCH_SIZE: 8
  # NUM_WORKERS: 10
  # SAMPLER: 'scene_balance'
  # N_SAMPLES_SCENE: 500
  # SAMPLE_WITH_REPLACEMENT: True
  LR: 1e-4
  # LOG_INTERVAL: 50
  # VAL_INTERVAL: 0.25
  # VAL_BATCHES: 500
  EPOCHS: 300
  # loss
  ROT_LOSS: 'rot_angle_loss'
  TRANS_LOSS: 'trans_l1_loss'
  LAMBDA: 1.
  REPRO_LOSS: 
    TYPE: 'l1+sqrt'
    DEPTH_MIN: 0.1
    DEPTH_MAX: 1000
    DEPTH_TARGET: 5
    REPRO_HARD_CLAMP: 1000
    REPRO_SOFT_CLAMP: 50
    REPRO_SOFT_CLAMP_MIN: 1
BACKPROJECT_ANCHORS: False
