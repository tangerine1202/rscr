MODEL: 'RSCRegression'
ENCODER:
  TYPE: 'ResUNet'
  BLOCK_TYPE: 1
  NUM_BLOCKS: '3-3-3'
  NOT_CONCAT: False
  NUM_OUT_LAYERS: 32
AGGREGATOR:
  TYPE: 'CorrelationVolumeWarpingQKV'
  POSITION_ENCODER: True
  MAX_SCORE_CHANNEL: True
HEAD:
  TYPE: 'DeepRSCRBlock'
POSE_SOLVER: 'PNP'
PNP:
  USE_RANSAC: False
  ALGO: 'SQPNP'
  RANSAC_ITER: 1000
  REPROJECTION_INLIER_THRESHOLD: 3
  CONFIDENCE: 0.9999
TRAINING:
  BATCH_SIZE: 4
  NUM_WORKERS: 10
  SAMPLER: 'scene_balance'
  N_SAMPLES_SCENE: 100
  SAMPLE_WITH_REPLACEMENT: True
  LR: 1e-4
  LOG_INTERVAL: 50
  VAL_INTERVAL: 0.25
  VAL_BATCHES: 500
  EPOCHS: 30
  # loss
  ROT_LOSS: 'rot_angle_loss'
  TRANS_LOSS: 'trans_l1_loss'
  LAMBDA: 1.
  # rscr loss
  SELF_REPRO_LOSS: 'self_repro_loss'
BACKPROJECT_ANCHORS: False
DATASET:
  HEIGHT: 270
  WIDTH: 360
  MIN_OVERLAP_SCORE: 0.4  # [train only] discard data with overlap_score < min_overlap_score
  MAX_OVERLAP_SCORE: 0.8  # [train only] discard data with overlap_score < min_overlap_score
