TRAINING:
  BATCH_SIZE: 4
  NUM_WORKERS: 16
  SAMPLER: 'scene_balance'
  N_SAMPLES_SCENE: 700
  SAMPLE_WITH_REPLACEMENT: True
  LOG_INTERVAL: 50
  VAL_INTERVAL: 0.25
  VAL_BATCHES: 500
  EPOCHS: 50
DATASET:
  DATA_SOURCE: 'MapFree'
  DATA_ROOT: 'data/mapfree/'
  SCENES: None  # should be a list [] or None. If none, use all scenes.
  ESTIMATED_DEPTH: None  # To load estimated depth map, provide the suffix to the depth files, e.g. 'dptnyu', 'dptkiti'
  AUGMENTATION_TYPE: None
  # HEIGHT: 720 # original image size
  # WIDTH: 540  # original image size
  HEIGHT: 360
  WIDTH: 270
  MIN_OVERLAP_SCORE: 0.4  # [train only] discard data with overlap_score < min_overlap_score
  MAX_OVERLAP_SCORE: 0.8  # [train only] discard data with overlap_score < min_overlap_score
